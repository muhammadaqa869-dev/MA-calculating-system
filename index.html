<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator.com</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fruit">
        <input id="typeplace" placeholder="0" readonly>
        <div id="apple">
            <button onclick="appendToDisplay('+')" class="plus">+</button>
            <button onclick="appendToDisplay('7')" class="kor">7</button>
            <button onclick="appendToDisplay('8')" class="kor">8</button>
            <button onclick="appendToDisplay('9')" class="kor">9</button>
            <button onclick="appendToDisplay('-')" class="plus">-</button>
            <button onclick="appendToDisplay('4')" class="kor">4</button>
            <button onclick="appendToDisplay('5')" class="kor">5</button>
            <button onclick="appendToDisplay('6')" class="kor">6</button>
            <button onclick="appendToDisplay('*')" class="plus">*</button>
            <button onclick="appendToDisplay('1')" class="kor">1</button>
            <button onclick="appendToDisplay('2')" class="kor">2</button>
            <button onclick="appendToDisplay('3')" class="kor">3</button>
            <button onclick="appendToDisplay('/')" class="plus">/</button>
            <button onclick="appendToDisplay('.')" class="kor">.</button>
            <button onclick="appendToDisplay('0')" class="kor">0</button>
            <button onclick="calculate()" class="plus">=</button>
            <button onclick="clearDisplay()" class="plus">AC</button>
            <button onclick="deleteOne()" class="plus">⌫</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
